<main class="landing-page">
  <section class="hero container" aria-labelledby="landing-title">
    <div class="hero-copy">
      <h1 id="landing-title" class="title">
        Indovina la<br />
        <span class="accent">regex</span><span class="cursor-blink" aria-hidden="true"></span>
      </h1>
      <p class="subtitle">
        Sfida i tuoi avversari con enigmi sulle espressioni regolari. Trova il pattern segreto,
        un tentativo alla volta.
      </p>
      <div class="ctas">
        <a routerLink="/sfide" class="btn btn-primary">Esplora le sfide <span aria-hidden="true">→</span></a>
        <a routerLink="/come-funziona" class="btn btn-ghost">Come funziona</a>
      </div>
    </div>
  </section>

  <section class="benefits container" aria-labelledby="benefits-title">
    <div class="section-intro">
      <p class="section-label">IL GIOCO, IN BREVE</p>
      <h2 id="benefits-title">Un piccolo enigma.<br /><span>Una grande soddisfazione.</span></h2>
    </div>
    <div class="features">
      <article class="feature" *ngFor="let f of features; let index = index">
        <div class="feature-header">
          <span class="feature-number">0{{ index + 1 }}</span>
          <span class="feature-icon" aria-hidden="true">{{ f.icon }}</span>
        </div>
        <h3>{{ f.title }}</h3>
        <p>{{ f.text }}</p>
      </article>
    </div>
  </section>
</main>
